---
name: Self-hosted Runner Container-build Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-runner-container-build-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docker-socket-smoke:
    name: Validate trusted Docker client route
    runs-on: docs-container-build
    timeout-minutes: 10
    steps:
      - name: Assert the trusted container-build boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${DOCKER_HOST:-}" = "unix:///var/run/docker.sock"
          test -S /var/run/docker.sock
          test "$(docker info --format '{{.Name}}')" = "$HOSTNAME"
          if pgrep -x dockerd; then
            echo "dockerd must run only in the pod sidecar" >&2
            exit 1
          fi
          if touch /.self-hosted-runner-container-build-smoke; then
            rm -f /.self-hosted-runner-container-build-smoke
            echo "the filesystem root must not be writable by the runner" >&2
            exit 1
          fi

      - name: Verify Docker client, Buildx, Compose, and the pod-local daemon
        shell: bash
        run: |
          set -euo pipefail
          docker version --format "{{.Client.Version}}"
          docker buildx version
          docker compose version
          docker version --format "{{.Server.Version}}"
