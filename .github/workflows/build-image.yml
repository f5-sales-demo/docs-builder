---
name: Build and Publish Docker Image
on:
  workflow_dispatch:
    inputs:
      dispatch_downstream:
        description: Trigger Pages rebuilds after a protected-main publication
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify, and optionally publish the image
    runs-on: docs-container-build
    permissions:
      contents: read
      packages: write # import cache and publish only from protected main
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The immutable runner image provides the catalogued Node.js toolchain.
      - name: Resolve latest docs-theme
        run: npm update @f5-sales-demo/docs-theme --package-lock-only --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set image coordinates
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "CACHE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:buildcache-main"
            echo "PILOT_IMAGE=docs-builder:pilot-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Refuse publication from an unprotected main branch
        if: github.ref == 'refs/heads/main' && !github.ref_protected
        run: |
          echo "::error::main must be protected before publishing images or cache"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load branch pilot
        if: github.ref != 'refs/heads/main'
        env:
          CACHE_IMAGE: ${{ env.CACHE_IMAGE }}
          PILOT_IMAGE: ${{ env.PILOT_IMAGE }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "$PILOT_IMAGE" \
            --file docker/Dockerfile \
            --cache-from "type=registry,ref=$CACHE_IMAGE" \
            --load \
            .

      - name: Smoke-test branch pilot
        if: github.ref != 'refs/heads/main'
        env:
          PILOT_IMAGE: ${{ env.PILOT_IMAGE }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/docs-builder-pilot-output"
          mkdir -p "$output"
          chmod 0777 "$output"
          docker run --rm --pull=never \
            -e DOCS_TITLE='Docs Builder Pilot' \
            -e DOCS_DESCRIPTION='ARC branch smoke test' \
            -e DOCS_BASE=/docs-builder \
            -e DOCS_SITE=https://example.invalid \
            -v "$GITHUB_WORKSPACE/docs:/content/docs:ro" \
            -v "$output:/output" \
            "$PILOT_IMAGE"
          test -f "$output/index.html"
          test -f "$output/llms.txt"
          test -f "$output/llms-full.txt"
          test -f "$output/llms-small.txt"

      - name: Publish protected-main multi-architecture image and cache
        id: publish
        if: github.ref == 'refs/heads/main' && github.ref_protected
        env:
          CACHE_IMAGE: ${{ env.CACHE_IMAGE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/docs-builder-build-metadata.json"
          delay=30
          for attempt in 1 2 3; do
            rm -f "$metadata"
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE_NAME:latest" \
              --tag "$IMAGE_NAME:$IMAGE_SHA" \
              --file docker/Dockerfile \
              --cache-from "type=registry,ref=$CACHE_IMAGE" \
              --cache-to "type=registry,ref=$CACHE_IMAGE,mode=max" \
              --metadata-file "$metadata" \
              --provenance=false \
              --push \
              .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::All image publication attempts failed"
              exit 1
            fi
            sleep "$delay"
            delay=$((delay * 2))
          done
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # Backticks are Markdown delimiters, not shell substitutions.
          # shellcheck disable=SC2016
          printf 'Published `%s@%s`\n' "$IMAGE_NAME" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published architectures
        if: github.ref == 'refs/heads/main' && github.ref_protected
        env:
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # jq interpolation is intentionally single-quoted.
          # shellcheck disable=SC2016
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]'

      - name: Pull and smoke-test the published native image by digest
        if: github.ref == 'refs/heads/main' && github.ref_protected
        env:
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          output="$RUNNER_TEMP/docs-builder-published-output"
          mkdir -p "$output"
          chmod 0777 "$output"
          docker pull "$image"
          docker run --rm --pull=never \
            -e DOCS_TITLE='Docs Builder Published Image' \
            -e DOCS_DESCRIPTION='ARC digest smoke test' \
            -e DOCS_BASE=/docs-builder \
            -e DOCS_SITE=https://example.invalid \
            -v "$GITHUB_WORKSPACE/docs:/content/docs:ro" \
            -v "$output:/output" \
            "$image"
          test -f "$output/index.html"
          test -f "$output/llms.txt"
          test -f "$output/llms-full.txt"
          test -f "$output/llms-small.txt"

  dispatch:
    name: Trigger downstream Pages rebuilds
    needs: build
    if: github.ref == 'refs/heads/main' && github.ref_protected && inputs.dispatch_downstream
    runs-on: docs-socketless
    environment: release
    permissions: {}
    steps:
      - name: Dispatch to docs-sites repos
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          CONFIG_REPO="f5-sales-demo/docs-control"
          CONFIG_PATH=".github/config/docs-sites.json"

          echo "Fetching docs-sites.json from ${CONFIG_REPO}..."
          SITES=$(gh api "repos/${CONFIG_REPO}/contents/${CONFIG_PATH}" --jq '.content' | base64 -d)

          echo "$SITES" | jq -r '.[] | select(.rebuild_dispatch != false) | .url' | while read -r url; do
            temp="${url#https://}"
            org="${temp%%.*}"
            path="${temp#*/}"
            repo="${org}/${path%%/*}"
            echo "Dispatching github-pages-deploy.yml to ${repo}..."
            if gh workflow run github-pages-deploy.yml --repo "$repo"; then
              echo "  [OK] ${repo}"
            else
              echo "  [FAIL] ${repo} (workflow may not exist yet)"
            fi
          done
