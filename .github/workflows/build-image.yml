---
name: Build and Publish Docker Image
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish multi-architecture image
    runs-on: [self-hosted, Linux, X64, docs-builder, container-build]
    permissions:
      contents: read
      packages: write # publish immutable and latest image tags to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The trusted container-build runner provides the catalogued Node.js 22.23.2
      # toolchain. Do not download a floating runtime during a release build.
      - name: Resolve latest docs-theme
        run: npm update @f5-sales-demo/docs-theme --package-lock-only --legacy-peer-deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # The trusted host has binfmt registrations and Docker Buildx. These are
      # deliberately host capabilities rather than privileged per-job setup.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push with retry
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          MAX_ATTEMPTS=3
          DELAY=60
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Build attempt $attempt of $MAX_ATTEMPTS"
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE_NAME:latest" \
              --tag "$IMAGE_NAME:$IMAGE_SHA" \
              --file docker/Dockerfile \
              --push \
              .; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Build failed on attempt $attempt"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting ${DELAY}s before retry..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
            fi
          done
          echo "::error::All $MAX_ATTEMPTS build attempts failed"
          exit 1

  dispatch:
    name: Trigger downstream Pages rebuilds
    needs: build
    runs-on: [self-hosted, Linux, X64, docs-builder, ubuntu-24.04]
    environment: release
    permissions: {}
    steps:
      - name: Dispatch to docs-sites repos
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          CONFIG_REPO="f5-sales-demo/docs-control"
          CONFIG_PATH=".github/config/docs-sites.json"

          echo "Fetching docs-sites.json from ${CONFIG_REPO}..."
          SITES=$(gh api "repos/${CONFIG_REPO}/contents/${CONFIG_PATH}" --jq '.content' | base64 -d)

          echo "$SITES" | jq -r '.[] | select(.rebuild_dispatch != false) | .url' | while read -r url; do
            temp="${url#https://}"
            org="${temp%%.*}"
            path="${temp#*/}"
            repo="${org}/${path%%/*}"
            echo "Dispatching github-pages-deploy.yml to ${repo}..."
            if gh workflow run github-pages-deploy.yml --repo "$repo"; then
              echo "  [OK] ${repo}"
            else
              echo "  [FAIL] ${repo} (workflow may not exist yet)"
            fi
          done
